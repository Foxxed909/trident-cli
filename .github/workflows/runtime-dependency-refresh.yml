name: Runtime Dependency Refresh

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/runtime-dependency-refresh.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh audited root graph
        run: |
          npm ci
          npm audit fix --force

      - name: Refresh audited web graph
        run: |
          cd web
          npm ci
          npm audit fix --force

      - name: Verify upgraded runtime
        run: |
          npm run check:source
          npm run build
          node --test scripts/smoke-test.mjs
          npm audit --omit=dev
          cd web
          npm run build
          npm audit --omit=dev

      - name: Emit tested manifests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const file of ['package.json','package-lock.json','web/package.json','web/package-lock.json']) {
            const b64 = Buffer.from(readFileSync(file)).toString('base64');
            console.log('FILE_BEGIN:' + file);
            for (let i = 0; i < b64.length; i += 4000) console.log(b64.slice(i, i + 4000));
            console.log('FILE_END:' + file);
          }
          NODE
