name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm run build
      - run: node --test scripts/smoke-test.mjs
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          cd web
          npm audit --omit=dev
